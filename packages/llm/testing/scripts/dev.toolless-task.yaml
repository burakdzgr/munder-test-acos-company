# M3 delegation cascade (T36, demo steps 12/14): a toolless dev run —
# start work, talk in the task thread (sentinel channel = own task thread),
# hand the result to review. Shared by every `member` agent; the adapter
# keys sessions per (agent, task) so parallel devs never share a cursor.
match: { role: member, taskFixture: none }
steps:
  - action: update_task_status
    args: { status: IN_PROGRESS, note: Picking up the delegated task }
  - action: send_message
    args:
      body: "Started on the task — plan drafted, working toolless for the M3 gate; implementation lands with the sandbox milestone."
  - action: request_review
    args: { summary: Toolless deliverable ready for review }
  # 2026-08-19 canlı boşluk (golden path stage 10): incelemeci ilk turda
  # DAİMA changes_requested veriyor (deterministik MVP politikası) ve rework
  # yeniden girişi bu ajanın döngüsünü yeniden başlatıyor — ama bu script'in
  # rework dalı yoktu: "script ... is exhausted" ile ölüyor, görev
  # CHANGES_REQUESTED'da asılı kalıyor, kalite zinciri hiç kapanmıyordu.
  # Kanonik script (32 §6.1, backend-dev.task-implement.yaml) tam olarak bu
  # dala sahip; araçsız akışın karşılığı burada.
  - onSignal: { reviewVerdict: changes_requested }
    action: send_message
    args:
      body: "Review findings addressed — resubmitting the toolless deliverable."
  - action: complete_task
    args: { summary: Rework done, deliverable resubmitted for re-review }
