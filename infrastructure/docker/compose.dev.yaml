# Dev overlay (Mode A): docker compose -f compose.yaml -f compose.dev.yaml up
# Source sync via develop.watch (27 §3); server/workers run tsx watch, web runs
# the Vite dev server (build stage) proxying /api + /ws to the server.
services:
  server:
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@acos/server", "dev"]
    develop:
      watch:
        - action: sync
          path: ../../apps/server/src
          target: /app/apps/server/src
        - action: rebuild
          path: ../../pnpm-lock.yaml

  web:
    build:
      target: build
    command: ["pnpm", "--filter", "@acos/web", "dev"]
    environment:
      ACOS_API_PROXY_TARGET: http://server:3000
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 > /dev/null"]
    develop:
      watch:
        - action: sync
          path: ../../apps/web/src
          target: /app/apps/web/src
        - action: rebuild
          path: ../../pnpm-lock.yaml

  agent-worker:
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@acos/agent-worker", "dev"]
    develop:
      watch:
        - action: sync
          path: ../../workers/agent-worker/src
          target: /app/workers/agent-worker/src
        - action: rebuild
          path: ../../pnpm-lock.yaml

  execution-worker:
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@acos/execution-worker", "dev"]
    develop:
      watch:
        - action: sync
          path: ../../workers/execution-worker/src
          target: /app/workers/execution-worker/src
        - action: rebuild
          path: ../../pnpm-lock.yaml

  sandbox-manager:
    environment:
      NODE_ENV: development
    command: ["pnpm", "--filter", "@acos/sandbox-manager", "dev"]
    develop:
      watch:
        - action: sync
          path: ../../services/sandbox-manager/src
          target: /app/services/sandbox-manager/src
        - action: rebuild
          path: ../../pnpm-lock.yaml
