server {
    listen 80;
    server_name _;

    location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location /api {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # SPA deploy freshness: index.html must always revalidate — without
        # this, heuristic caching (ETag/Last-Modified only) let browsers and
        # the Electron shell keep serving a PREVIOUS bundle after a rebuild.
        # Hashed /assets stay immutable-cacheable below.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
